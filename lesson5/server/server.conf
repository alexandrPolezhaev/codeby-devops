port 1194
proto udp4
dev tun0
topology subnet
server 10.8.0.0 255.255.255.0
ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/servercodeby.crt
key /etc/openvpn/server/servercodeby.key
tls-crypt /etc/openvpn/server/tls-crypt.key
remote-cert-tls client
keepalive 10 120
verb 3
push "redirect-gateway def1 local"
push "dns server 0 address 1.1.1.1"
push "dns server 0 resolve-domains ."
